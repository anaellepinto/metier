# La veille : chaque matin, GitHub lance l'extraction France Travail sur ses machines,
# met à jour data/ et le résumé de la page, et enregistre le tout par un commit.
# Les identifiants sont dans Settings -> Secrets and variables -> Actions (FT_CLIENT_ID, FT_CLIENT_SECRET,
# et, facultatifs, LBA_API_KEY, ADZUNA_APP_ID, ADZUNA_APP_KEY, JOOBLE_KEY pour les autres sources).
#
# Un seul lancement par nuit, comme le site d'origine (VincentFavarin/metier) : demandé à 5 h UTC,
# GitHub le libère en pratique un peu plus tard dans la matinée. Pas d'attente sur la machine :
# un fork qui occupe trop longtemps les machines de GitHub voit ses workflows coupés.
name: veille

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:          # et le bouton « Run workflow » pour lancer à la main, tout de suite

permissions:
  contents: write             # le workflow doit pouvoir pousser son commit

concurrency:
  group: veille               # une seule veille à la fois : les autres attendent leur tour
  cancel-in-progress: false

env:
  TZ: Europe/Paris            # les dates (fichiers du jour, message de commit) sont celles de Paris

jobs:
  extraire:
    runs-on: ubuntu-24.04     # version fixée : ubuntu-latest change de version sans prévenir
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Une panne de France Travail ne bloque pas la chaîne : les autres sources, le résumé et le commit
      # tournent quand même. Mais elle n'est plus silencieuse : la dernière étape met le lancement en rouge.
      - name: Extraire les offres France Travail
        id: ft
        continue-on-error: true
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: |
          if [ -z "$FT_CLIENT_ID" ] || [ -z "$FT_CLIENT_SECRET" ]; then
            echo "::error::Secrets FT_CLIENT_ID / FT_CLIENT_SECRET absents de ce dépôt (Settings -> Secrets and variables -> Actions). Un dépôt copié (fork) n'hérite pas des secrets de l'original."
            exit 1
          fi
          # l'API France Travail flanche parfois quelques minutes : trois essais, cinq minutes d'écart
          for essai in 1 2 3; do
            if python scripts/extraire.py; then exit 0; fi
            echo "Extraction en échec (essai $essai sur 3)"
            if [ "$essai" -lt 3 ]; then sleep 300; fi
          done
          echo "::error::Extraction France Travail en échec après trois essais : identifiants refusés ou API indisponible (voir le journal de cette étape)."
          exit 1

      # Les autres sources : une source sans clé est ignorée, une source en panne n'arrête rien.
      - name: Extraire les autres sources (La bonne alternance, Adzuna, Jooble)
        continue-on-error: true
        env:
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python scripts/autres_sources.py

      - name: Refaire le résumé
        run: python scripts/resumer.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "veille : offres du $(date +%F)" || echo "rien de nouveau"
          git pull --rebase   # un commit a pu arriver pendant la collecte
          git push

      - name: Signaler l'échec de France Travail
        if: steps.ft.outcome == 'failure'
        run: |
          echo "::error::Les offres France Travail n'ont pas été mises à jour aujourd'hui : le site garde celles de la dernière extraction réussie."
          exit 1
